name: CI/CD Pipeline - Thetavlo

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Esto selecciona automáticamente el entorno según la rama
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: 'pnpm'

      - name: Instalar Dependencias
        run: pnpm install --frozen-lockfile

      - name: Determinar Entorno y Proyecto GCP
        id: env-config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "PROJECT_ID=thetavlo-prod" >> $GITHUB_OUTPUT
            echo "ENV=production" >> $GITHUB_OUTPUT
            echo "BUCKET=gs://thetavlo.com" >> $GITHUB_OUTPUT
          else
            echo "PROJECT_ID=thetavlo-dev" >> $GITHUB_OUTPUT
            echo "ENV=development" >> $GITHUB_OUTPUT
            echo "BUCKET=gs://dev.thetavlo.com" >> $GITHUB_OUTPUT
          fi

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Tomará automáticamente la key del Environment correspondiente (development o production)
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Compilar Frontend y Backend
        run: pnpm build
        env:
          CLIENT_FIREBASE_API_KEY: ${{ secrets.CLIENT_FIREBASE_API_KEY }}
          CLIENT_FIREBASE_PROJECT_ID: ${{ secrets.CLIENT_FIREBASE_PROJECT_ID }}
          CLIENT_FIREBASE_AUTH_DOMAIN: ${{ secrets.CLIENT_FIREBASE_AUTH_DOMAIN }}
          CLIENT_FIREBASE_STORAGE_BUCKET: ${{ secrets.CLIENT_FIREBASE_STORAGE_BUCKET }}
          CLIENT_FIREBASE_APP_ID: ${{ secrets.CLIENT_FIREBASE_APP_ID }}
          CLIENT_FIREBASE_DATABASE_URL: ${{ secrets.CLIENT_FIREBASE_DATABASE_URL }}
          CLIENT_BACKEND_URI: ${{ secrets.CLIENT_BACKEND_URI }}

      - name: Autenticar gsutil
        run: |
          gcloud auth activate-service-account --key-file=${{ env.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Desplegar Frontend a Google Cloud Storage
        run: |
          gsutil rsync -R client/dist ${{ steps.env-config.outputs.BUCKET }}
          gsutil -m setmeta -h "Cache-Control:public, max-age=3600" ${{ steps.env-config.outputs.BUCKET }}/**

      - name: Autenticar Docker con Google Cloud Registry
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Construir y Subir Imagen Docker del Backend
        working-directory: ./backend
        run: |
          docker build -t gcr.io/${{ steps.env-config.outputs.PROJECT_ID }}/thetavlo-backend:${{ github.sha }} .
          docker push gcr.io/${{ steps.env-config.outputs.PROJECT_ID }}/thetavlo-backend:${{ github.sha }}

      - name: Desplegar Backend a Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: thetavlo-backend
          image: gcr.io/${{ steps.env-config.outputs.PROJECT_ID }}/thetavlo-backend:${{ github.sha }}
          region: europe-west1
          flags: '--min-instances=0 --max-instances=3'