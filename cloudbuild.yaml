steps:
  # 1. Construir la imagen del Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mi-repo/backend:$COMMIT_SHA'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'

  # 2. Construir la imagen del Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mi-repo/client:$COMMIT_SHA'
      - '-f'
      - 'client/Dockerfile'
      - './client'

  # 3. Subir la imagen del Backend a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mi-repo/backend:$COMMIT_SHA'

  # 4. Subir la imagen del Frontend a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mi-repo/client:$COMMIT_SHA'

  # 5. Desplegar el Backend en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'backend-service'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/mi-repo/backend:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'

  # 6. Desplegar el Frontend en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'client-service'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/mi-repo/client:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mi-repo/backend:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mi-repo/client:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY